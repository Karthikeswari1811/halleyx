<!DOCTYPE html>
<html>
<head>
  <title>Workflow Engine</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      text-align: center;
      padding: 40px;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 400px;
      margin: auto;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }

    input {
      width: 80%;
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background: #4A6CF7;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #3a57d1;
    }

    .logs {
      text-align: left;
      margin-top: 20px;
      background: #f1f1f1;
      padding: 10px;
      border-radius: 5px;
      max-height: 250px;
      overflow-y: auto;
    }

    .step {
      margin-bottom: 10px;
      padding: 8px;
      background: #fff;
      border-left: 4px solid #4A6CF7;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Workflow Execution</h2>
    <p style="color: gray;">Automate workflows with rule-based execution</p>

    <input type="number" id="amount" placeholder="Enter Amount" />

    <br>
    <button onclick="runWorkflow()">Execute Workflow</button>

    <div class="logs" id="output"></div>
  </div>

  <script>
    async function runWorkflow() {
      const amount = document.getElementById("amount").value;

      document.getElementById("output").innerHTML = "Running workflow...";

      try {
        const res = await fetch("http://localhost:3000/workflows/1/execute", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ amount: Number(amount) })
        });

        const data = await res.json();
        console.log(data);

        let html = "<h3>Execution Logs:</h3>";
        if (!data.logs) {
          document.getElementById("output").innerHTML = "❌ " + data.message;
          return;}

        data.logs.forEach(log => {
          html += `
            <div class="step">
              <b>Step:</b> ${log.step} <br>
              <b>Condition:</b> ${log.condition} <br>
              <b>Next:</b> ${log.next_step === "END" ? "✅ Completed" : log.next_step} <br>
              <b>Status:</b> ${log.status} <br>
              <b>Time:</b> ${log.time}
            </div>
          `;
        });

        document.getElementById("output").innerHTML = html;

      } catch (err) {
        document.getElementById("output").innerHTML = "❌ Error: " + err;
      }
    }
  </script>

</body>
</html>
